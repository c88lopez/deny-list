# A Service gives the pods one stable address and load-balances across the ready ones.
# It finds pods by label (selector), not by name, since pod names change on every rollout.
#
# type: NodePort exposes it on port 30083 of the node (30080 is importer-api,
# 30081 Argo CD, 30082 importer-graphql).
# Inside the cluster it's also reachable at http://deny-list.deny-list.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: deny-list
  namespace: deny-list
spec:
  type: NodePort
  selector:
    app: deny-list
  ports:
    - name: http
      port: 80 # the Service's port
      targetPort: http # the container's named port (3000)
      nodePort: 30083 # the port on your machine
